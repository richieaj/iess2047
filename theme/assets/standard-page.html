<script>
  // ── Sidebar show/hide ─────────────────────────────────────────────────────
  function hideSidebar() {
    var ln = $('.structure > .nav-holder > .left-nav');
    ln.animate({ left: -ln.outerWidth() }, function () {
      ln.removeClass('in-transition shown').addClass('hidden');
      $('.nav-shield').removeClass('shown');
      $(window).trigger('resize');
    });
  }
  function showSidebar() {
    var ln = $('.structure > .nav-holder > .left-nav');
    $('.nav-shield').addClass('shown');
    ln.addClass('shown').removeClass('hidden').css({ left: '-100%' }).css({ left: -ln.outerWidth() }).animate({ left: 0 }, function () {
      ln.removeClass('in-transition');
    });
    $(window).trigger('resize');
  }
  $('.sidebar-toggle, .nav-shield').off('click').on('click', function () {
    var ln = $('.structure > .nav-holder > .left-nav');
    if (ln.is(':visible') || $('.nav-shield').is('.shown')) {
      hideSidebar();
    } else if (!ln.is(':empty')) {
      showSidebar();
    }
  });
  $('.left-nav').off('click').on('click', 'a, button', function () {
    if ($('.nav-shield').is(':visible')) {
      $('.nav-shield').trigger('click');
    }
  });

  // ── Size helpers for Python ───────────────────────────────────────────────
  function normalize_width() {
    var c = document.querySelector('.anvil-panel-col-JXOYRH');
    return c.clientWidth - 20;
  }
  function normalize_height() {
    var c = document.querySelector('.anvil-panel-col-JXOYRH');
    return c.clientHeight;
  }
  function window_width_getter()  { return window.innerWidth; }
  function window_height_getter() { return window.innerHeight; }

  // ── Grid layout switcher ─────────────────────────────────────────────────
  // All cases use clean white; grid columns/rows drive the layout.
  function grid_changer(graph_quant, graph_height, case_id) {
    var graphsEl  = document.querySelector('.anvil-role-the_graphs');
    var pkrsvt    = document.querySelector('.anvil-panel-col-PKRSVT');
    var jxoyrh    = document.querySelector('.anvil-panel-col-JXOYRH > div > div');

    graphsEl.style.backgroundColor = '#ffffff';
    graphsEl.style.display         = 'grid';
    graph_height = graph_height - 10;

    if (case_id === 1) {
      // narrow width, limited height — stack everything vertically
      if (graph_quant === 1) {
        graphsEl.style.gridTemplateColumns = '1fr';
        graphsEl.style.gridTemplateRows    = graph_height + 'px';
      } else {
        graphsEl.style.gridTemplateColumns = '1fr';
        graphsEl.style.gridAutoRows        = graph_height + 'px';
      }
    } else if (case_id === 2) {
      // wider, limited height — side by side where possible
      if (graph_quant === 1) {
        graphsEl.style.gridTemplateColumns = '1fr';
        graphsEl.style.gridAutoRows        = graph_height + 'px';
      } else if (graph_quant === 2) {
        graphsEl.style.height              = 'max-content';
        graphsEl.style.gridTemplateColumns = '1fr 1fr';
        graphsEl.style.gridAutoRows        = graph_height + 'px';
      } else if (graph_quant === 3) {
        graphsEl.style.gridTemplateColumns = '1fr 1fr 1fr';
        graphsEl.style.gridAutoRows        = graph_height + 'px';
      } else if (graph_quant === 4) {
        graphsEl.style.gridTemplateColumns = '1fr 1fr';
        graphsEl.style.gridAutoRows        = graph_height + 'px';
      }
    } else if (case_id === 3) {
      // narrow, tall — stack vertically, halve height per row
      if (graph_quant === 1) {
        graphsEl.style.gridTemplateColumns = '1fr';
        graphsEl.style.gridTemplateRows    = graph_height + 'px';
      } else if (graph_quant === 2) {
        graphsEl.style.gridTemplateColumns = '1fr';
        graphsEl.style.gridTemplateRows    = (graph_height / 2) + 'px';
      } else {
        graphsEl.style.gridTemplateColumns = '1fr';
        graphsEl.style.gridAutoRows        = (graph_height / 2) + 'px';
      }
    } else if (case_id === 4) {
      // optimal: wide + tall — best layout
      if (graph_quant === 1) {
        graphsEl.style.gridTemplateColumns = '1fr';
        graphsEl.style.gridTemplateRows    = graph_height + 'px';
      } else if (graph_quant === 2) {
        graphsEl.style.gridTemplateColumns = '1fr 1fr';
        graphsEl.style.gridTemplateRows    = graph_height + 'px';
      } else if (graph_quant === 3) {
        graphsEl.style.gridTemplateColumns = '1fr 1fr 1fr';
        graphsEl.style.gridTemplateRows    = graph_height + 'px';
      } else if (graph_quant === 4) {
        graphsEl.style.gridTemplateColumns = '1fr 1fr';
        graphsEl.style.gridTemplateRows    = (graph_height / 2) + 'px';
      }
    }
  }

  // ── On DOM ready ─────────────────────────────────────────────────────────
  $(document).ready(function () {

    // Video player
    var videoSrc = '<iframe width="560" height="315"'
      + ' src="https://www.youtube-nocookie.com/embed/Nq4WkV0EJts?si=XNc6iJ7JYx-QkCuS"'
      + ' title="IESS Launch Video" frameborder="0"'
      + ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"'
      + ' allowfullscreen></iframe>';
    var videoEnablerBtn = document.querySelector('#video_enabler_btn');
    videoEnablerBtn.addEventListener('click', function (e) {
      var videoScreen = document.querySelector('.video_screen');
      videoScreen.style.display = 'grid';
      videoScreen.innerHTML     = videoSrc;
      videoScreen.addEventListener('click', function () {
        videoScreen.style.display = 'none';
        videoScreen.innerHTML     = '';
      });
    });

    // Height sync
    var pkrsvt   = document.querySelector('.anvil-panel-col-PKRSVT');
    var jxoyrh   = document.querySelector('.anvil-panel-col-JXOYRH');
    var jxoyrhDD = document.querySelector('.anvil-panel-col-JXOYRH > div > div');
    var absTabH  = jxoyrh.getBoundingClientRect().top - pkrsvt.getBoundingClientRect().top;
    jxoyrh.style.height   = (pkrsvt.clientHeight - absTabH) + 'px';
    jxoyrhDD.style.height = pkrsvt.clientHeight + 'px';

    // Lever panel expand / collapse
    var holderFull  = document.querySelector('.anvil-panel-row-GYKMWG');
    var holderLeft  = document.querySelector('.anvil-panel-col-BITUCV');
    var pkrsvtEl    = document.querySelector('.anvil-panel-col-PKRSVT');
    var curtainKey  = document.querySelector('.anvil-role-curtain_maker');
    var panelCloser = document.querySelector('.anvil-role-panel_closer button');

    if (window.innerWidth >= 1310) {
      // Show collapse arrow
      curtainKey.innerHTML = '<div style="font-size:1.1rem; opacity:0.9;">&#8250;</div>';
      holderLeft.style.width = '50px';
      holderFull.style.gridTemplateColumns = '50px 1fr';

      holderLeft.addEventListener('click', function () {
        curtainKey.style.opacity = '0';
        holderLeft.style.width   = '390px';
        holderLeft.style.overflow = 'auto';
        pkrsvtEl.style.transform = 'translateX(340px)';
        curtainKey.style.display = 'none';
      });

      panelCloser.addEventListener('click', function () {
        curtainKey.style.opacity  = '1';
        curtainKey.style.display  = 'grid';
        holderLeft.style.overflow = 'hidden';
        holderFull.style.gridTemplateColumns = '50px 1fr';
        holderLeft.style.transform = 'translateX(0)';
        holderLeft.style.width     = '50px';
        pkrsvtEl.style.transform   = 'translateX(0)';
      });
    } else {
      curtainKey.style.display  = 'none';
      panelCloser.style.display = 'none';
    }

    // Landing screen (disabled by default)
    var landingScreen  = document.querySelector('.landing_screen');
    var footerControl  = document.querySelector('.footer-anvil-iess');
    var testMode       = false;

    if (testMode) {
      landingScreen.innerHTML  = '<div style="text-align:center; padding:32px;">Welcome to IESS 2047 Version 3.0</div>';
      landingScreen.style.fontSize = '36px';
      footerControl.style.display  = 'none';
    } else {
      landingScreen.style.display = 'none';
      footerControl.style.display = 'grid';
    }
  });
</script>
